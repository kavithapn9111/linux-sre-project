global:
  resolve_timeout: 5m

route:
  receiver: sre-local
  group_by:
    - alertname
    - instance
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 2h

receivers:
  - name: sre-local

inhibit_rules:
  - source_matchers:
      - severity = critical
    target_matchers:
      - severity = warning
    equal:
      - alertname
      - instance
